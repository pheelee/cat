name: Renovate
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        id: generate-app-token
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ vars.GHA_IRBE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.GHA_IRBE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          RENOVATE_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DETECT_HOST_RULES_FROM_ENV: "true"
          RENOVATE_PLATFORM: github
          GHCR_IO_TOKEN: ${{ secrets.GHCR_IO_TOKEN }}