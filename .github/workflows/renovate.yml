name: Renovate
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-app-token
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ vars.GHA_IRBE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.GHA_IRBE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        env:
          RENOVATE_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DETECT_HOST_RULES_FROM_ENV: "true"
          RENOVATE_PLATFORM: github
          GHCR_IO_TOKEN: ${{ secrets.GHCR_IO_TOKEN }}